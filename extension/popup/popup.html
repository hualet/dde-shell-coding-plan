<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DDE Coding Plan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 360px; min-height: 240px; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; color: #333; background: #fff;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .header h2 { font-size: 15px; font-weight: 600; }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 30px; height: 30px; border: none; border-radius: 6px;
    cursor: pointer; background: #f3f4f6; display: flex; align-items: center;
    justify-content: center; font-size: 14px; transition: background 0.15s;
  }
  .icon-btn:hover { background: #e5e7eb; }

  .status-bar {
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
    padding: 8px 12px; background: #f9fafb; border-radius: 8px;
    border: 1px solid #e5e7eb;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .status-dot.connected { background: #28c76f; }
  .status-dot.disconnected { background: #8b949e; }
  .status-dot.auth_failed, .status-dot.error, .status-dot.timeout { background: #ea5455; }
  .status-label { font-size: 12px; color: #6b7280; }

  .quota-list { display: flex; flex-direction: column; gap: 10px; }
  .quota-card {
    border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 14px;
    transition: box-shadow 0.15s;
  }
  .quota-card:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .quota-card.error-state { border-left: 3px solid #ea5455; }
  .quota-card.ok-state { border-left: 3px solid #28c76f; }
  .quota-card.warn-state { border-left: 3px solid #ff9f43; }
  .quota-card.critical-state { border-left: 3px solid #ea5455; }
  .quota-card.loading-state { border-left: 3px solid #90caf9; }
  .quota-card.unknown-state { border-left: 3px solid #8b949e; }

  .quota-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .quota-name { font-weight: 600; font-size: 13px; }
  .quota-ratio {
    font-weight: 600; font-size: 15px;
  }
  .ratio-ok { color: #28c76f; }
  .ratio-warn { color: #ff9f43; }
  .ratio-critical { color: #ea5455; }
  .ratio-unknown { color: #8b949e; }

  .quota-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .quota-row-label {
    font-size: 11px; color: #6b7280; width: 52px; flex-shrink: 0;
  }
  .quota-row-bar {
    flex: 1; height: 5px; background: #e5e7eb; border-radius: 2.5px; overflow: hidden;
  }
  .quota-bar-fill {
    height: 100%; border-radius: 2.5px; transition: width 0.4s ease;
  }
  .bar-ok { background: #28c76f; }
  .bar-warn { background: #ff9f43; }
  .bar-critical { background: #ea5455; }
  .bar-unknown { background: #d1d5db; }
  .quota-row-value {
    font-size: 11px; font-weight: 600; width: 42px; text-align: right; flex-shrink: 0;
  }

  .quota-meta {
    display: flex; justify-content: space-between; font-size: 11px; color: #9ca3af;
    margin-top: 6px;
  }
  .error-msg { color: #ea5455; }

  .empty-state {
    text-align: center; padding: 24px; color: #9ca3af;
  }
  .empty-state p { margin-bottom: 12px; }
  button {
    padding: 8px 16px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 500;
  }
  .btn-primary { background: #1976d2; color: white; }
  .btn-primary:hover { background: #1565c0; }
  .btn-secondary { background: #f3f4f6; color: #374151; }
  .btn-secondary:hover { background: #e5e7eb; }
  .refreshing {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #9ca3af; border-top-color: #1976d2;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-right: 4px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="header">
  <h2>Coding Plan</h2>
  <div class="header-actions">
    <button class="icon-btn" id="refreshBtn" title="刷新全部">&#x21bb;</button>
    <button class="icon-btn" id="settingsBtn" title="配置">&#x2699;</button>
  </div>
</div>

<div class="status-bar">
  <div class="status-dot disconnected" id="statusDot"></div>
  <span class="status-label" id="statusLabel">未连接</span>
</div>

<div class="quota-list" id="quotaList"></div>

<script src="popup.js" type="module"></script>
</body>
</html>
